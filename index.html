:root{--bg:#f5f1eb;--ink:#151515;--muted:#77716b;--line:#d9d1c8;--red:#b7202c;--soft:#f2dede}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{width:min(100%,760px);margin:auto;padding:12px 18px 58px} button{font:inherit} .hidden{display:none!important}

.kicker{font-size:13px;letter-spacing:.16em;color:var(--red);font-weight:900;margin-bottom:10px}
h1{font-size:38px;line-height:1.08;margin:0 0 14px;letter-spacing:-.055em}

.meta{display:flex;gap:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin:18px 0 20px;font-size:13px;color:#5e5954}
.btn{width:100%;border-radius:16px;border:1px solid var(--line);padding:16px 18px;font-weight:800;cursor:pointer;margin-top:10px;background:#faf7f2;color:var(--ink)} .btn.primary{background:var(--red);border-color:var(--red);color:white}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.qnum{font-size:25px;font-weight:900;letter-spacing:-.05em} .qnum small{font-size:14px;font-weight:500;color:#59544f}
.horror{font-size:11px;letter-spacing:.14em;color:var(--red);font-weight:900}
.progress{height:3px;background:#e4ddd5;margin:0 0 12px;overflow:hidden} .progress>div{height:100%;background:var(--red);transition:width .2s}
.qimage{width:100%;aspect-ratio:16/8.2;object-fit:cover;display:block;border:1px solid #d6cec5;margin-bottom:12px}

.result-kicker{font-size:12px;letter-spacing:.16em;color:#777;margin-bottom:10px}

.score-box{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:16px 0 22px}
.score{margin:12px 0} .score-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px} .score-top strong{font-size:18px}

.example{background:var(--soft);border-radius:18px;padding:18px 20px;font-size:16px;line-height:1.65;margin:22px 0 28px}

.analysis p{font-size:16.5px;line-height:1.78;margin:0 0 22px;letter-spacing:-.02em} .closing{font-weight:800}
.share-actions{border-top:1px solid var(--line);padding-top:18px;margin-top:30px}

.types-wrap{border-top:1px solid var(--line);margin-top:34px;padding-top:26px}
.types-title{font-size:20px;font-weight:900;margin:0 0 5px;letter-spacing:-.035em}
.types-sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.types-grid{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
.type-card{border:0;border-bottom:1px solid var(--line);background:transparent;padding:0;cursor:pointer;text-align:left}
.type-card-name{display:block;padding:14px 2px;font-weight:900;font-size:15px;line-height:1.25}

.back-link{border:0;background:none;color:var(--red);font-weight:800;padding:0;cursor:pointer}
.type-detail .result-image{margin-top:8px}
.type-detail .analysis{margin-top:26px}

<script>

const QUESTIONS_RAW=[{"axis": "삑딱쿵", "image": "images/q1.jpg", "text": "오래된 일기장을 발견했다. 마지막 페이지를 펼치는 순간, 바로 옆에서 갑자기 “쾅!” 하는 큰 소리가 난다.", "answers": [{"text": "“뭐야?”\n하고 소리 난 쪽부터 확인함.", "score": 1}, {"text": "“아 깜짝아;”\n놀란 건 놀란 거고 문제는 풀어야지.", "score": 2}, {"text": "“악!!! 뭐야!!!”\n놀란 가슴 진정시키느라 일기장 내용은 이미 까먹음.", "score": 3}, {"text": "“으아아아악!!!!!”\n일기장은 이미 바닥에 있고 나는 일행 뒤에 있음.", "score": 4}]}, {"axis": "삑딱쿵", "image": "images/q2.jpg", "text": "벽에 걸린 가족사진에서 이상한 점을 찾으라는 문제가 나왔다. 사진에 얼굴을 가까이 대고 살펴보는 순간, 사진 속 인물이 갑자기 움직인다.", "answers": [{"text": "“오 움직인다.”\n이상한 점 찾았다고 좋아함.", "score": 1}, {"text": "“어우 씨 깜짝아;;”\n한 발 물러났다가 다시 얼굴 들이밀고 관찰함.", "score": 2}, {"text": "“악!! 얘 움직여!!!”\n발견은 내가 했지만 확인은 일행한테 시킴.", "score": 3}, {"text": "“으아아악!!! 사진이 움직여!!!!”\n이제 이상한 점이고 뭐고 저 사진 근처에 안 감.", "score": 4}]}, {"axis": "창공", "image": "images/q3.jpg", "text": "자물쇠를 열자 방 전체의 불이 갑자기 꺼진다. 그런데 10초가 지나도 아무 일도 일어나지 않고, 다음 안내도 나오지 않는다.", "answers": [{"text": "“그래서 불 언제 켜지는데…”\n슬슬 지루해지기 시작함.", "score": 1}, {"text": "“뭐 나오려나?”\n무섭다기보단 연출 시작한 것 같아서 은근 기대 중.", "score": 2}, {"text": "“아니 이게 더 싫어… 뭐 나올 거잖아…”\n아무것도 안 나왔는데 이미 일행 옆에 딱 붙어 있음.", "score": 3}, {"text": "“뭐야 뭐야 뭐야 왜 아무것도 안 해!!!!”\n차라리 뭐라도 빨리 나오라고 하면서 일행 붙잡고 덜덜 떠는 중.", "score": 4}]}, {"axis": "창공", "image": "images/q4.jpg", "text": "문을 열었더니 끝이 잘 보이지 않는 어두운 복도가 나온다. 저 멀리 작은 조명 하나만 켜져 있고, 그곳까지 직접 걸어가야 한다.", "answers": [{"text": "“저기 가라는 건가?”\n이미 복도 절반쯤 가 있음.", "score": 1}, {"text": "“와 여기 뭐 나오기 딱 좋게 생겼네.”\n경계는 하는데 발은 계속 앞으로 감.", "score": 2}, {"text": "“잠깐만… 이걸 그냥 가라고?”\n갑자기 누가 앞장설지 공평한 가위바위보를 제안함.", "score": 3}, {"text": "“난 절대 앞에는 못 가. 뒤에도 못 가.”\n탱 두 명 사이에 끼워달라고 해서 인간 샌드위치 완성.", "score": 4}]}, {"axis": "추격", "image": "images/q5.jpg", "text": "복도를 지나던 중 뒤쪽 문이 벌컥 열린다. NPC가 당신들을 발견하고 전력으로 쫓아오기 시작한다. 앞에 보이는 문까지 뛰어가야 한다.", "answers": [{"text": "“어? 뛰어야 돼?”\nNPC보다 일행들이 갑자기 뛰어서 같이 뛰기 시작함.", "score": 1}, {"text": "“어어 온다 온다!!”\n무섭긴 한데 이런 게 공포방이지ㅋㅋ 하면서 뛰어감.", "score": 2}, {"text": "“뛰어!!! 빨리 뛰어!!!!”\nNPC보다 내가 일행을 더 공포스럽게 재촉함.", "score": 3}, {"text": "“으아아아아악!!!! function decodeChoices(value){

function axisScores(axis){
  return QUESTIONS
    .filter(q=>q.axis===axis)
    .sort((a,b)=>a.id-b.id)
    .map(q=>Number(choices[q.id] ?? 1));
}
function displayScore(axis){
  const [s1,s2]=axisScores(axis);

  // Same raw total can still show a slightly different profile score
  // depending on which of the two situations triggered the stronger reaction.
  const table={
    "1,1":8,
    "1,2":20, "2,1":24,
    "1,3":36, "2,2":33, "3,1":40,
    "1,4":49, "2,3":52, "3,2":56, "4,1":59,
    "2,4":65, "3,3":68, "4,2":72,
    "3,4":82, "4,3":87,
    "4,4":96
  };

  return table[`${s1},${s2}`] ?? 50;
}
function classify(){
  const raw={};
  AXES.forEach(a=>raw[a]=axisScores(a).reduce((x,y)=>x+y,0));

  const vals=Object.values(raw);
  if(vals.every(v=>v>=6)) return "극쫄";
  if(vals.every(v=>v<=4)) return "극탱";

  const max=Math.max(...vals);
  let candidates=AXES.filter(a=>raw[a]===max);

  if(candidates.length>1){
    const bestDisplay=Math.max(...candidates.map(a=>displayScore(a)));
    candidates=candidates.filter(a=>displayScore(a)===bestDisplay);
  }

  if(candidates.length>1){
    // Final tie-breaker from the actual pair pattern.
    // This keeps identical total scores from always collapsing to the same axis.
    candidates.sort((a,b)=>{
      const pa=axisScores(a), pb=axisScores(b);
      const va=pa[1]*10+pa[0];
      const vb=pb[1]*10+pb[0];
      return vb-va;
    });
  }

  return candidates[0];
}

function drawWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines=2){
  const chars=[...text];let line="",lines=[];
  for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}
  if(line)lines.push(line);
  lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
  return y+lines.length*lineHeight
}
