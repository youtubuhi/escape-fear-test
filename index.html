<style>
:root{--bg:#0e0f12;--card:#17191e;--line:#292c34;--text:#f6f6f6;--muted:#aeb2bc;--accent:#f4eee3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:620px;margin:auto;padding:22px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 36px rgba(0,0,0,.22)}
.hidden{display:none!important}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
h1{font-size:31px;line-height:1.15;margin:0 0 12px} h2{font-size:25px;margin:0 0 10px}
p{margin-top:0} .muted{color:var(--muted)}
button{font:inherit}
.btn{width:100%;border:0;border-radius:15px;padding:15px 16px;font-weight:800;cursor:pointer;margin-top:10px}
.primary{background:var(--accent);color:#111} .ghost{background:#23262d;color:#fff;border:1px solid #343842}
.progress{height:7px;background:#282b32;border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar{height:100%;background:var(--accent);width:0}
.qnum{font-size:13px;color:var(--muted);margin-bottom:10px}
.start-image{width:100%;height:auto;display:block;border-radius:17px;border:1px solid #30333b;margin:0 0 18px}
.qimage{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:17px;border:1px solid #30333b;display:block;margin-bottom:17px}
.question{font-size:20px;font-weight:850;line-height:1.45;margin-bottom:16px}
.answers{display:grid;gap:10px}
.answer{width:100%;text-align:left;background:#22252b;color:#fff;border:1px solid #343740;border-radius:15px;padding:15px;white-space:pre-line;cursor:pointer}
.answer:hover{background:#292d35}
.result-image{width:100%;object-fit:cover;object-position:center;border-radius:17px;border:1px solid #30333b}
.result-image-top{
  width:min(100%,320px);
  height:auto;
  max-height:none;
  aspect-ratio:auto;
  object-fit:contain;
  display:block;
  margin:0 auto 20px;
}
.result-eyebrow{margin-top:2px}
.result-name{font-size:29px;line-height:1.2;margin-bottom:10px}
.result-desc{margin-bottom:16px}
.score{margin:15px 0}
.score-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.score-top strong{font-size:17px}
.meter{height:10px;background:#292c33;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent)}
.result-note{background:#22252b;border-radius:15px;padding:14px;margin:18px 0;color:#ddd}
.shareline{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.footer{font-size:11px;color:#777;text-align:center;margin-top:16px}

@media (max-width: 600px){
  main{padding:10px 10px 24px}
  .card{padding:14px;border-radius:16px}
  .progress{height:5px;margin-bottom:10px}
  .qnum{font-size:11px;margin-bottom:6px}
  .qimage{
    width:100%;
    aspect-ratio:1200/630;
    max-height:165px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:10px;
  }
  .question{
    font-size:15px;
    line-height:1.35;
    margin-bottom:10px;
  }
  .answers{gap:7px}
  .answer{
    font-size:12.5px;
    line-height:1.3;
    padding:9px 11px;
    border-radius:11px;
  }
  .eyebrow{font-size:10px}
  h1{font-size:26px}
  .btn{padding:12px 14px;font-size:14px}
  .footer{font-size:9px;margin-top:10px}
}


.result-desc{
  white-space:pre-line;
  color:#d8dbe3;
  line-height:1.72;
  font-size:15px;
  margin:2px 0 20px;
}
@media (max-width:600px){
  .result-desc{font-size:13.5px;line-height:1.65;margin-bottom:16px}
  .result-name{font-size:24px}
}

<script>
const BASE_QUESTIONS = [{"axis": "삑딱쿵", "image": "images/q1.jpg", "text": "오래된 일기장을 발견했다. 마지막 페이지를 펼치는 순간, 바로 옆에서 갑자기 “쾅!” 하는 큰 소리가 난다.", "answers": [{"text": "“뭐야?”\n하고 소리 난 쪽부터 확인함.", "score": 1}, {"text": "“아 깜짝아;”\n놀란 건 놀란 거고 문제는 풀어야지.", "score": 2}, {"text": "“악!!! 뭐야!!!”\n놀란 가슴 진정시키느라 일기장 내용은 이미 까먹음.", "score": 3}, {"text": "“으아아아악!!!!!”\n일기장은 이미 바닥에 있고 나는 일행 뒤에 있음.", "score": 4}]}, {"axis": "삑딱쿵", "image": "images/q2.jpg", "text": "벽에 걸린 가족사진에서 이상한 점을 찾으라는 문제가 나왔다. 사진에 얼굴을 가까이 대고 살펴보는 순간, 사진 속 인물이 갑자기 움직인다.", "answers": [{"text": "“오 움직인다.”\n이상한 점 찾았다고 좋아함.", "score": 1}, {"text": "“어우 씨 깜짝아;;”\n한 발 물러났다가 다시 얼굴 들이밀고 관찰함.", "score": 2}, {"text": "“악!! 얘 움직여!!!”\n발견은 내가 했지만 확인은 일행한테 시킴.", "score": 3}, {"text": "“으아아악!!! 사진이 움직여!!!!”\n이제 이상한 점이고 뭐고 저 사진 근처에 안 감.", "score": 4}]}, {"axis": "창공", "image": "images/q3.jpg", "text": "자물쇠를 열자 방 전체의 불이 갑자기 꺼진다. 그런데 10초가 지나도 아무 일도 일어나지 않고, 다음 안내도 나오지 않는다.", "answers": [{"text": "“그래서 불 언제 켜지는데…”\n슬슬 지루해지기 시작함.", "score": 1}, {"text": "“뭐 나오려나?”\n무섭다기보단 연출 시작한 것 같아서 은근 기대 중.", "score": 2}, {"text": "“아니 이게 더 싫어… 뭐 나올 거잖아…”\n아무것도 안 나왔는데 이미 일행 옆에 딱 붙어 있음.", "score": 3}, {"text": "“뭐야 뭐야 뭐야 왜 아무것도 안 해!!!!”\n차라리 뭐라도 빨리 나오라고 하면서 일행 붙잡고 덜덜 떠는 중.", "score": 4}]}, {"axis": "창공", "image": "images/q4.jpg", "text": "문을 열었더니 끝이 잘 보이지 않는 어두운 복도가 나온다. 저 멀리 작은 조명 하나만 켜져 있고, 그곳까지 직접 걸어가야 한다.", "answers": [{"text": "“저기 가라는 건가?”\n이미 복도 절반쯤 가 있음.", "score": 1}, {"text": "“와 여기 뭐 나오기 딱 좋게 생겼네.”\n경계는 하는데 발은 계속 앞으로 감.", "score": 2}, {"text": "“잠깐만… 이걸 그냥 가라고?”\n갑자기 누가 앞장설지 공평한 가위바위보를 제안함.", "score": 3}, {"text": "“난 절대 앞에는 못 가. 뒤에도 못 가.”\n탱 두 명 사이에 끼워달라고 해서 인간 샌드위치 완성.", "score": 4}]}, {"axis": "추격", "image": "images/q5.jpg", "text": "복도를 지나던 중 뒤쪽 문이 벌컥 열린다. NPC가 당신들을 발견하고 전력으로 쫓아오기 시작한다. 앞에 보이는 문까지 뛰어가야 한다.", "answers": [{"text": "“어? 뛰어야 돼?”\nNPC보다 일행들이 갑자기 뛰어서 같이 뛰기 시작함.", "score": 1}, {"text": "“어어 온다 온다!!”\n무섭긴 한데 이런 게 공포방이지ㅋㅋ 하면서 뛰어감.", "score": 2}, {"text": "“뛰어!!! 빨리 뛰어!!!!”\nNPC보다 내가 일행을 더 공포스럽게 재촉함.", "score": 3}, {"text": "“으아아아아악!!!!”\n뒤는 절대 안 봄. 앞사람 추월해서 제일 먼저 도착함.", "score": 4}]}, {"axis": "추격", "image": "images/q6.jpg", "text": "NPC를 피해 방 안에 숨었는데 “거기 있는 거 알아.”라는 목소리가 들린다. 문이 열리고 NPC가 들어오자, 다른 출구를 찾아 다시 도망쳐야 한다.", "answers": [{"text": "“아 들켰네.”\nNPC 들어오는 거 보고 출구부터 찾아서 유유히 이동함.", "score": 1}, {"text": "“와 여기까지 따라오네ㅋㅋ”\n긴장되긴 하는데 추격전 제대로 즐기는 중.", "score": 2}, {"text": "“아니 숨었잖아!!!! 왜 알아!!!!”\nNPC한테 억울함을 호소하면서 출구 찾아 허둥지둥 도망감.", "score": 3}, {"text": "“거기 있는 거 알아.” 듣는 순간 이미 패닉.\n문 열리기도 전에 갈 수 있는 문이란 문은 다 잡아당기고 있음.", "score": 4}]}, {"axis": "독립구간", "image": "images/q7.jpg", "text": "문제 하나를 풀자 모니터에 「한 명만 입장하십시오」라는 문구가 뜬다. 문을 열어보니 작은 방 가장 안쪽에 다음 문제에 필요한 물건이 놓여 있다. 누군가는 혼자 들어가 가져와야 한다.", "answers": [{"text": "“내가 갔다 올게.”\n대답 기다릴 것도 없이 이미 물건 들고 돌아오는 중.", "score": 1}, {"text": "“아 아무나 갔다 오자ㅋㅋ 내가 갈게.”\n괜히 쿨한 척 들어갔다가 나올 때 걸음이 두 배 빨라짐.", "score": 2}, {"text": "“난 아까 문제 풀었잖아.”\n갑자기 지금까지의 팀 기여도를 정산하기 시작함.", "score": 3}, {"text": "“난 진짜 절대 못 가.”\n협상이고 뭐고 바닥에 드러누워 인간 바리케이드 됨.", "score": 4}]}, {"axis": "독립구간", "image": "images/q8.jpg", "text": "일행과 함께 이동하던 중 갑자기 철문이 내려오면서 나 혼자 반대편에 떨어진다. 스피커에서는 「각자 앞에 있는 길로 이동하십시오」라는 안내가 나온다.", "answers": [{"text": "“오 각자 하는 건가?”\n뒤도 안 돌아보고 내 길부터 구경하러 감.", "score": 1}, {"text": "“어? 나 혼자네?”\n갑자기 조금 긴장되지만 애써 아무렇지 않은 척 앞으로 감.", "score": 2}, {"text": "“야 잠깐만!!! 너네 가지 마!!!!”\n철문 너머 일행에게 계속 말 걸면서 이동함.", "score": 3}, {"text": "“아니 잠깐만요 저 혼자인데요????”\n일행보다 스피커에 대고 제작자와 협상 시도 중.", "score": 4}]}, {"axis": "NPC 대면", "image": "images/q9.jpg", "text": "다음 방에 들어가자 고개를 숙인 NPC가 의자에 가만히 앉아 있다. 다음 문제에 필요한 열쇠는 그 NPC가 손에 쥐고 있다.", "answers": [{"text": "“저거 가져오면 되는 거지?”\nNPC 손에서 열쇠 쏙 빼서 돌아옴.", "score": 1}, {"text": "“저 사람… 안 움직이겠지?”\nNPC 눈치 슬쩍 보면서 조심조심 열쇠 가져옴.", "score": 2}, {"text": "“저거 네가 가져오면 안 돼?”\n자연스럽게 가장 가까이 서 있던 일행에게 임무를 양도함.", "score": 3}, {"text": "“저걸 가져오라고????”\nNPC가 열쇠를 쥔 순간부터 그건 이제 우리 팀 열쇠가 아니라고 생각함.", "score": 4}]}, {"axis": "NPC 대면", "image": "images/q10.jpg", "text": "방 안에 NPC가 테이블을 사이에 두고 앉아 있다. NPC가 천천히 고개를 들더니 맞은편의 빈 의자를 가리킨다. 테이블 위에는 다음 문제에 필요한 물건이 있고, NPC 맞은편에 앉아야 진행할 수 있다.", "answers": [{"text": "“여기 앉으면 되는 거죠?”\n냅다 맞은편에 앉아서 NPC가 뭐 할지 기다림.", "score": 1}, {"text": "“와… 가까이서 보니까 좀 무섭네.”\n긴장되긴 하지만 얌전히 앉아서 시선만 살짝 피함.", "score": 2}, {"text": "“꼭 내가 앉아야 돼?”\nNPC가 의자 가리키는데 일행들이랑 눈치게임부터 시작함.", "score": 3}, {"text": "“나 못 봐, 나 못 봐.”\nNPC 쪽은 쳐다보지도 않고 눈 감은 채 상황 끝나기만 기다림.", "score": 4}]}];
const RESULTS = {"극쫄": {"name": "👑 제작자 효자형", "image": "images/result1.jpg", "desc": "제작자가 준비한 모든 공포 연출을 단 하나도 놓치지 않는 타입입니다.
큰 소리가 나면 놀라고, 불이 꺼지면 무섭고, 긴 복도가 나오면 가기 싫습니다.
NPC가 나타나면 가까이 가기 싫고, 쫓아오면 누구보다 열심히 도망갑니다.
심지어 아무 일도 안 일어나면 “왜 아무것도 안 하지? 이제 뭐 나오려나?” 하면서 알아서 무서워합니다.
혼자 가라고 하면 못 가겠고, 같이 가도 무섭고, 가만히 있어도 다음 연출이 걱정됩니다.
다른 사람은 특정 연출에서만 무너진다면 당신은 장르를 가리지 않는 올라운더 쫄에 가깝습니다.
덕분에 제작자가 몇 달 동안 고민해서 만든 조명, 음향, NPC, 추격, 독립구간까지 전부 효과 만점입니다.

const AXES = ["삑딱쿵","창공","추격","독립구간","NPC 대면"];

function trackEvent(name, params={}){
  if(typeof gtag === "function") gtag("event", name, params);
}

let order=[], step=0;
let answersByAxis={"삑딱쿵":[],"창공":[],"추격":[],"독립구간":[],"NPC 대면":[]};
let allChosen=[];

function shuffle(a){
  const arr=[...a];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}

function begin(){
  trackEvent("test_start");
  order=shuffle(BASE_QUESTIONS.map((q,i)=>({...q,id:i})));
  step=0;
  answersByAxis={"삑딱쿵":[],"창공":[],"추격":[],"독립구간":[],"NPC 대면":[]};
  allChosen=[];
  document.getElementById("start").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}

function render(){
  const q=order[step];
  document.getElementById("bar").style.width=`${(step/10)*100}%`;
  document.getElementById("qnum").textContent=`${step+1} / 10`;
  document.getElementById("qimage").src=q.image;
  document.getElementById("question").textContent=q.text;
  const box=document.getElementById("answers"); box.innerHTML="";
  shuffle(q.answers).forEach(a=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=a.text;
    b.onclick=()=>choose(q,a.score);
    box.appendChild(b);
  });
}

function choose(q,score){
  answersByAxis[q.axis].push(score);
  allChosen.push(score);
  step++;
  if(step<10) render(); else finish();
}

function displayScore(pair){
  // Internal scoring stays 1-4, shown score looks like a natural 0-100 scale.
  const s1=pair[0], s2=pair[1];
  const weighted=((s1-1)*0.47+(s2-1)*0.53)/3;
  return Math.max(3,Math.min(98,Math.round(4+weighted*92)));
}

function hashTie(axis){
  let h=0;
  const str=allChosen.join("")+axis;
  for(let i=0;i<str.length;i++) h=((h<<5)-h)+str.charCodeAt(i), h|=0;
  return Math.abs(h);
}

function classify(){
  const raw={};
  AXES.forEach(a=>raw[a]=answersByAxis[a].reduce((x,y)=>x+y,0));
  const vals=Object.values(raw);
  if(vals.every(v=>v>=6)) return ["극쫄",raw];
  if(vals.every(v=>v<=4)) return ["극탱",raw];

  const max=Math.max(...vals);
  let candidates=AXES.filter(a=>raw[a]===max);
  if(candidates.length>1){
    const disp={};
    candidates.forEach(a=>disp[a]=displayScore(answersByAxis[a]));
    const dmax=Math.max(...Object.values(disp));
    candidates=candidates.filter(a=>disp[a]===dmax);
  }
  if(candidates.length>1) candidates.sort((a,b)=>hashTie(a)-hashTie(b));
  return [candidates[0],raw];
}

function finish(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const [type,raw]=classify(), info=RESULTS[type];
  trackEvent("test_complete", {result_type:type});
  document.getElementById("resultName").textContent=info.name;
  document.getElementById("resultDesc").textContent=info.desc;
  document.getElementById("resultImage").src=info.image;

  const list=document.getElementById("scoreList"); list.innerHTML="";
  AXES.forEach(axis=>{
    const v=displayScore(answersByAxis[axis]);
    const row=document.createElement("div"); row.className="score";
    row.innerHTML=`<div class="score-top"><span>${axis} 공포도</span><strong>${v}</strong></div>
      <div class="meter"><div class="fill" style="width:${v}%"></div></div>`;
    list.appendChild(row);
  });
}

function resultText(){
  const [type]=classify(), info=RESULTS[type];
  const lines=[`나는 ${info.name}!`];
  AXES.forEach(a=>lines.push(`${a} 공포도 ${displayScore(answersByAxis[a])}`));
  lines.push("방탈출 공포 유형 테스트");
  return lines.join("\n");
}

async function sharePayload(title,text,url){
  if(navigator.share){
    try{
      await navigator.share({title,text,url});
      return;
    }catch(e){}
  }
  const fallback=[text,url].filter(Boolean).join("\n");
  try{
    await navigator.clipboard.writeText(fallback);
    alert("공유 문구를 복사했어요!");
  }catch(e){
    alert(fallback);
  }
}

async function shareResult(){
  const [trackedType]=classify();
  trackEvent("share_result_click", {result_type:trackedType});
  const [type]=classify();
  const info=RESULTS[type];
  const scorePairs=AXES.map(a=>`${a} ${displayScore(answersByAxis[a])}점`).join(" · ");
  const text=`나는 ${info.name}!\n${scorePairs}\n너는 어떤 공포에 약한지 해봐 👇`;
  await sharePayload("나의 방탈출 공포 유형 결과",text,location.href);
}

  await sharePayload("방탈출 공포 유형 테스트",text,location.href);
